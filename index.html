#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;font-style:normal;line-height:1;transform:translate(-50%,-50%);text-shadow:0 0 6px currentColor,0 0 16px currentColor,0 0 30px currentColor;opacity:0;animation:rise 2.4s ease-out forwards;will-change:transform,opacity}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}
  14%{opacity:1;transform:translate(-50%,-62%) scale(1.2) rotate(calc(var(--rot) * .3))}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - var(--rise))) scale(.8) rotate(var(--rot))}
}
.h.pop{animation-name:popH}
@keyframes popH{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}
  26%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,calc(-50% - 70px)) scale(.9)}
}
#title{position:absolute;left:0;right:0;top:36%;transform:translateY(-50%);padding:0 6%;box-sizing:border-box;text-align:center;font-family:var(--f-script);font-size:clamp(50px,13vw,124px);line-height:1.08;color:#fff;pointer-events:none;opacity:0;text-shadow:0 0 4px #fff,0 0 14px #ff9ec8,0 0 32px #ff4f9a,0 0 64px #ff2f86;animation:glow 3s ease-in-out infinite alternate;text-wrap:balance}
#title.show{opacity:1}
#title.hide{opacity:0;transition:opacity 1s ease}
#title .w{display:inline-block;white-space:nowrap}
#title .c{display:inline-block;opacity:0}
#title.show .c{animation:letterIn .95s cubic-bezier(.2,.8,.2,1) forwards}
#title.hide .c{opacity:1}
@keyframes letterIn{from{opacity:0;transform:translateY(20px) scale(.8);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glow{from{text-shadow:0 0 3px #fff,0 0 10px #ff9ec8,0 0 24px #ff4f9a,0 0 48px #ff2f86}to{text-shadow:0 0 5px #fff,0 0 18px #ffb3d3,0 0 40px #ff4f9a,0 0 84px #ff2f86}}
#ui{position:absolute;inset:0;pointer-events:none}
.mini{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font:600 20px/1 var(--f-pixel);cursor:pointer}
.mini.off{opacity:.4;text-decoration:line-through}
#hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:62%;padding:10px 14px;border:2px solid var(--red);border-radius:6px;background:rgba(10,0,3,.78);font-size:clamp(15px,3.8vw,20px);line-height:1.25;box-shadow:0 0 12px var(--red),inset 0 0 14px rgba(255,45,77,.25)}
#hint.g{border-color:var(--green);box-shadow:0 0 12px var(--green),inset 0 0 14px rgba(57,255,136,.2);background:rgba(2,10,5,.78)}
#hintBar{display:block;height:5px;margin-top:8px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#hintBar b{display:block;height:100%;width:0;background:currentColor;box-shadow:0 0 8px currentColor;transition:width .15s linear}
#dlg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--kb,0px) + 18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;opacity:0;transform:translateY(14px);transition:opacity .25s,transform .25s}
#dlg.in{opacity:1;transform:none}
.dbox{pointer-events:auto;width:min(720px,100%);box-sizing:border-box;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;background:rgba(3,8,5,.82);border:2px solid var(--edge);border-radius:6px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 0 0 1px color-mix(in srgb,var(--edge) 35%,transparent),0 0 14px var(--edge),0 0 38px color-mix(in srgb,var(--edge) 45%,transparent),inset 0 0 22px color-mix(in srgb,var(--edge) 22%,transparent);cursor:pointer}
.dbox[data-theme="green"]{--edge:var(--green)}
.dbox[data-theme="red"]{--edge:var(--red);background:rgba(12,2,4,.84)}
.dbox[data-theme="mc"]{--edge:var(--gold);background:rgba(14,9,4,.8)}
#dtext{font-size:clamp(19px,4.6vw,27px);line-height:1.35;min-height:2.7em;color:var(--ink);text-shadow:0 0 8px color-mix(in srgb,var(--edge) 55%,transparent)}
.dbox.announce #dtext{text-align:center;font-size:clamp(22px,5.8vw,32px)}
#dbody{display:flex;flex-direction:column;gap:10px}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.btn{pointer-events:auto;min-height:44px;padding:8px 22px;font:600 clamp(17px,4.2vw,22px)/1 var(--f-pixel);color:#fff;background:rgba(0,0,0,.35);border:2px solid var(--edge);border-radius:6px;cursor:pointer;text-shadow:0 0 8px var(--edge);box-shadow:0 0 10px color-mix(in srgb,var(--edge) 70%,transparent)}
.btn:hover,.btn:focus-visible{background:color-mix(in srgb,var(--edge) 28%,transparent);outline:none}
.btn.flee{position:absolute;z-index:8;transition:left .18s ease-out,top .18s ease-out}
#dnext{align-self:flex-end;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#answer{width:100%;box-sizing:border-box;padding:11px 14px;font:400 20px/1.2 var(--f-pixel);color:#fff;background:rgba(0,0,0,.55);border:2px solid var(--edge);border-radius:6px;box-shadow:inset 0 0 12px color-mix(in srgb,var(--edge) 30%,transparent);outline:none;-webkit-user-select:text;user-select:text}
#answer::placeholder{color:rgba(255,255,255,.4)}
#answer.shake,.dbox.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#abtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));pointer-events:auto;width:96px;height:96px;border-radius:50%;border:3px solid var(--red);background:rgba(15,0,4,.7);color:#fff;font:600 44px/1 var(--f-pixel);box-shadow:0 0 18px var(--red),inset 0 0 18px rgba(255,45,77,.35);touch-action:none;cursor:pointer;animation:beat 1.1s ease-in-out infinite}
#abtn.down{background:rgba(255,45,77,.45);animation:none;transform:scale(.94)}
@keyframes beat{50%{transform:scale(1.07)}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .75s ease;z-index:6}
#start{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 24px;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(3,8,5,.35),rgba(3,8,5,.88));cursor:pointer;transition:opacity .8s}
#start.gone{opacity:0;pointer-events:none}
#start .sc{font-family:var(--f-script);font-size:clamp(64px,18vw,150px);line-height:1;color:#fff;text-shadow:0 0 4px #fff,0 0 16px #ff9ec8,0 0 38px #ff4f9a,0 0 80px #ff2f86;animation:glow 3s ease-in-out infinite alternate}
#start p{margin:0;font-size:clamp(17px,4.4vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--green);text-shadow:0 0 10px var(--green);animation:blink 1.6s ease-in-out infinite}
#start small{max-width:420px;color:rgba(255,255,255,.6);font-size:15px}
@keyframes blink{50%{opacity:.35}}
#again{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto}
@media (prefers-reduced-motion:reduce){#title,#start .sc{animation:none}#abtn,#dnext{animation:none}}

.dbox[data-theme="beach"]{--edge:#8fc2ff;background:rgba(3,8,20,.84)}
.ft{position:absolute;transform:translate(-50%,-50%);font:600 clamp(28px,7.5vw,48px)/1 var(--f-pixel);color:#fff;white-space:nowrap;text-shadow:0 0 8px #ff7fb0,0 0 22px #ff3f86;animation:ftUp 1.8s ease-out forwards;pointer-events:none}
@keyframes ftUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const easeInOut=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const tween=(ms,fn,ease=k=>k)=>new Promise(res=>{const t0=performance.now();const step=now=>{const k=clamp((now-t0)/ms,0,1);fn(ease(k),k);k<1?requestAnimationFrame(step):res()};requestAnimationFrame(step)});
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

/* ---------- Sonido ---------- */
let AC=null,soundOn=true;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d=.08,type='triangle',v=.04,at=0){if(!soundOn||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+at;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const blip=()=>tone(380+Math.random()*140,.05,'square',.010);
const chime=()=>[784,988,1319].forEach((f,i)=>tone(f,.4,'sine',.045,i*.09));
const softChime=()=>tone(1046+Math.random()*300,.25,'sine',.025);
const nope=()=>{tone(220,.18,'sawtooth',.035);tone(165,.26,'sawtooth',.035,.12)};
$('#snd').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.classList.toggle('off',!soundOn)});

/* ---------- Corazones (DOM) ---------- */
const fx=$('#fx');
function heart(x,y,o={}){
  if(fx.childElementCount>150)return;
  const e=document.createElement('i');
  const cols=['#ff5c93','#ff8fb8','#ff3d7f','#ffc2d9'];
  const dur=o.dur||rand(1800,2800);
  e.className='h'+(o.pop?' pop':'');
  e.textContent='♥';
  e.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+(o.size||rand(18,34))+'px;color:'+(o.color||cols[(Math.random()*cols.length)|0])+';--dx:'+(o.dx!==undefined?o.dx:rand(-60,60))+'px;--rise:'+(o.rise||rand(140,260))+'px;--rot:'+rand(-25,25)+'deg;animation-duration:'+dur+'ms;animation-delay:'+(o.delay||0)+'ms';
  e.addEventListener('animationend',()=>e.remove());
  fx.appendChild(e);
}
function burst(x,y,n=10,o={}){for(let i=0;i<n;i++)heart(x+rand(-30,30),y+rand(-20,20),Object.assign({delay:i*60,dx:rand(-90,90),rise:rand(120,300)},o))}
function heartRing(){
  const cx=innerWidth/2,cy=innerHeight*.36,s=Math.min(innerWidth,innerHeight*1.1)/38,N=40;
  for(let i=0;i<N;i++){
    const t=i/N*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    heart(cx+x*s,cy-y*s,{pop:true,size:rand(16,26),dur:3000,delay:i*70});
  }
}
let rainTimer=null;
function rain(ms){
  clearInterval(rainTimer);
  const t0=performance.now();
  rainTimer=setInterval(()=>{
    if(performance.now()-t0>ms){clearInterval(rainTimer);return}
    heart(rand(0,innerWidth),innerHeight+10,{size:rand(16,36),rise:rand(.45,.9)*innerHeight,dur:rand(3200,5200),dx:rand(-50,50)});
  },170);
}

/* ---------- Three.js ---------- */
let renderer;
const canvas=$('#gl');
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true})}catch(e){renderer=null}
if(!renderer){$('#startNote').textContent='Tu navegador no pudo iniciar el modo 3D. Prueba con otro navegador.';return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const FOV=40;
const camera=new THREE.PerspectiveCamera(FOV,1,.1,120);
const TAN=Math.tan(THREE.MathUtils.degToRad(FOV/2));
const amb=new THREE.AmbientLight(0xffffff,.85);
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(3,6,6);
scene.add(amb,sun);
function setLights(mode){
  if(mode==='beach'){amb.color.set(0x9db6ff);amb.intensity=.8;sun.color.set(0xcfe0ff);sun.intensity=.8;sun.position.set(-3,6,5)}
  else if(mode==='mc'){amb.color.set(0xb7b9ff);amb.intensity=.78;sun.color.set(0xffc58a);sun.intensity=.95;sun.position.set(-5,3,6)}
  else{amb.color.set(0xffffff);amb.intensity=.85;sun.color.set(0xffffff);sun.intensity=.7;sun.position.set(3,6,6)}
}

/* ---------- Texturas ---------- */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');draw(ctx,w,h);
  const tex=new THREE.CanvasTexture(c);
  tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;
  return {tex,ctx,canvas:c};
}
function noiseTex(draw,rep){
  const w=16,h=16;
  const r=canvasTex(w,h,ctx=>{
    const im=ctx.createImageData(w,h);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const c=draw(i,j),k=(j*w+i)*4;im.data[k]=c[0];im.data[k+1]=c[1];im.data[k+2]=c[2];im.data[k+3]=255}
    ctx.putImageData(im,0,0);
  });
  r.tex.wrapS=r.tex.wrapT=THREE.RepeatWrapping;r.tex.repeat.set(rep[0],rep[1]);
  return r.tex;
}
const jit=(b,a)=>{const n=(Math.random()-.5)*a;return [clamp(b[0]+n,0,255),clamp(b[1]+n,0,255),clamp(b[2]+n,0,255)]};
const grassPx=(i,j)=>jit([92,158,58],34);
const dirtPx=(i,j)=>jit([134,96,62],30);
const sidePx=(i,j)=>j<4?jit([92,158,58],34):jit([134,96,62],30);

/* ---------- Cara del gatito ---------- */
function drawCatFace(ctx,mood,blush){
  const C=32;
  ctx.fillStyle='#3b3b41';ctx.fillRect(0,0,C*5,C*4);
  ctx.fillStyle='#f3f3f3';ctx.fillRect(2*C,0,C,4*C);ctx.fillRect(C,2*C,3*C,2*C);
  ctx.fillStyle='#e58aa5';ctx.fillRect(2*C+6,2*C+4,C-12,C-14);
  ctx.fillStyle='#cfcfd4';ctx.fillRect(2*C+10,3*C+2,C-20,4);
  if(blush){ctx.fillStyle='rgba(255,84,120,.92)';ctx.fillRect(0,2*C,C,C);ctx.fillRect(4*C,2*C,C,C);ctx.fillRect(0,2*C+C-8,C,0)}
  [1,3].forEach((c,idx)=>{
    const x=c*C,y=C;
    if(mood==='happy'){
      ctx.strokeStyle='#c8ff9c';ctx.lineWidth=6;ctx.lineCap='square';
      ctx.beginPath();ctx.moveTo(x+4,y+C-8);ctx.lineTo(x+C/2,y+8);ctx.lineTo(x+C-4,y+C-8);ctx.stroke();
    }else if(mood==='serious'){
      ctx.fillStyle='#7fb069';ctx.fillRect(x+3,y+C/2-3,C-6,8);
      ctx.fillStyle='#000';ctx.fillRect(x+C/2-3,y+C/2-3,6,8);
      ctx.strokeStyle='#9a9aa4';ctx.lineWidth=4;ctx.beginPath();
      if(idx===0){ctx.moveTo(x+1,y+4);ctx.lineTo(x+C-1,y+13)}else{ctx.moveTo(x+1,y+13);ctx.lineTo(x+C-1,y+4)}
      ctx.stroke();
    }else{
      ctx.fillStyle='#7fb069';ctx.fillRect(x+3,y+5,C-6,C-12);
      ctx.fillStyle='#000';ctx.fillRect(x+C/2-3,y+7,6,C-16);
    }
  });
}

/* ---------- Gatito (cubos) ---------- */
class Cat{
  constructor(){
    this.mood='normal';this.blush=false;this.jump=0;this.purr=0;this.key='';
    const U=.3;
    this.g=new THREE.Group();this.g.scale.setScalar(U);
    this.body=new THREE.Group();this.g.add(this.body);
    const M=c=>new THREE.MeshLambertMaterial({color:c});
    const dark=M(0x3b3b41),mid=M(0x56565e),light=M(0xb9b9bf),white=M(0xf3f3f3);
    const bx=(w,h,d,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);(par||this.body).add(m);return m};
    [[1.1,3.5,0],[-1.1,3.5,0],[1.1,-3.5,1],[-1.1,-3.5,1]].forEach(([x,z,back])=>{
      bx(1.9,5,1.9,light,x,2.5,z);
      if(back)bx(2,1.2,2,dark,x,.6,z);
    });
    bx(4,2.4,9.6,light,0,6.2,0);
    bx(4.04,2.1,9.6,dark,0,8.45,0);
    bx(4.08,.35,1.2,mid,0,9.55,-2.6);bx(4.08,.35,1.2,mid,0,9.55,0);bx(4.08,.35,1.2,mid,0,9.55,2.4);
    bx(4.2,4.5,1,white,0,7.2,3.7);
    const face=canvasTex(160,128,ctx=>drawCatFace(ctx,'normal',false));
    this.face=face;
    const side=dark;
    this.head=new THREE.Mesh(new THREE.BoxGeometry(5,4,4),[side,side,side,side,new THREE.MeshLambertMaterial({map:face.tex}),side]);
    this.head.position.set(0,8.6,6.9);this.body.add(this.head);
    bx(1.2,1.4,1,dark,-1.6,10.9,6.3);bx(1.2,1.4,1,dark,1.6,10.9,6.3);
    this.tail=new THREE.Group();this.tail.position.set(0,8.9,-4.8);this.body.add(this.tail);
    bx(1.1,1.1,5,dark,0,0,-2.5,this.tail);
    const t2=new THREE.Group();t2.position.set(0,0,-5);t2.rotation.x=1.0;this.tail.add(t2);
    bx(1.1,1.1,5,dark,0,0,-2.5,t2);
  }
  update(dt,t){
    const j=this.jump>0;
    const ty=j?Math.abs(Math.sin(t*6.5))*3.8:0;
    this.body.position.y+=(ty-this.body.position.y)*(1-Math.exp(-dt*18));
    this.g.rotation.z=j?Math.sin(t*6.5)*.07:0;
    const fast=j||this.purr>.1;
    const wag=this.mood==='serious'?0:Math.sin(t*(fast?11:2.2))*(fast?.6:.35);
    this.tail.rotation.y=wag;
    this.body.scale.y=1+Math.sin(t*30)*.012*this.purr;
    this.purr*=Math.exp(-dt*1.4);
    this.head.rotation.x=this.mood==='serious'?.04:Math.sin(t*2)*.03;
    this.head.rotation.z=(j||this.purr>.2)?Math.sin(t*8)*.08:0;
    const key=this.mood+(this.blush?'b':'');
    if(key!==this.key){this.key=key;drawCatFace(this.face.ctx,this.mood,this.blush);this.face.tex.needsUpdate=true}
  }
}

/* ---------- Personajes estilo Minecraft ---------- */
function drawMCFace(ctx,o,s,img){
  ctx.imageSmoothingEnabled=false;
  const sk=hex(o.faceSkin),br=hex(o.brow),ov=o.ov;
  ctx.fillStyle=sk;ctx.fillRect(0,0,128,128);
  if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,128,128);
  if(s.closed||s.laugh){
    [ov.eyeL,ov.eyeR].forEach(e=>{
      ctx.fillStyle=sk;ctx.fillRect(e[0],e[1],e[2],e[3]);
      ctx.fillStyle=br;ctx.fillRect(e[0]+2,e[1]+e[3]*.5,e[2]-4,5);ctx.fillRect(e[0]+6,e[1]+e[3]*.5+5,e[2]-12,4);
    });
  }
  if(s.blush){
    ctx.fillStyle='rgba(255,64,96,.62)';
    [ov.cheekL,ov.cheekR].forEach(c=>ctx.fillRect(c[0],c[1],c[2],c[3]));
    ctx.fillStyle='rgba(255,64,96,.34)';
    [ov.cheekL,ov.cheekR].forEach(c=>ctx.fillRect(c[0]-4,c[1]+c[3],c[2]+8,6));
  }
  if(s.smile){
    const m=ov.mouth;
    ctx.fillStyle=sk;ctx.fillRect(m[0],m[1],m[2],m[3]);
    ctx.fillStyle=o.mouthColor;ctx.fillRect(m[0]+3,m[1]+2,6,4);ctx.fillRect(m[0]+m[2]-9,m[1]+2,6,4);ctx.fillRect(m[0]+8,m[1]+6,m[2]-16,5);
  }
  if(s.laugh){
    const m=ov.mouth;
    ctx.fillStyle=sk;ctx.fillRect(m[0]-6,m[1]-8,m[2]+12,m[3]+16);
    ctx.fillStyle='#6e1f2b';ctx.fillRect(m[0]-2,m[1]-3,m[2]+4,m[3]+10);
    ctx.fillStyle='#fff7ee';ctx.fillRect(m[0]-2,m[1]-3,m[2]+4,4);
    ctx.fillStyle='#e8788a';ctx.fillRect(m[0]+m[2]*.25,m[1]+m[3]-1,m[2]*.5,5);
  }
  if(s.sad){
    const m=ov.mouth;
    ctx.fillStyle=sk;ctx.fillRect(m[0],m[1],m[2],m[3]);
    ctx.fillStyle=o.mouthColor;ctx.fillRect(m[0]+7,m[1]+3,m[2]-14,4);ctx.fillRect(m[0]+2,m[1]+7,7,4);ctx.fillRect(m[0]+m[2]-9,m[1]+7,7,4);
  }
}
class Char{
  constructor(o){
    this.o=o;const p=.1;
    this.g=new THREE.Group();const g=new THREE.Group();this.g.add(g);this.inner=g;
    this.walkTarget=0;this.walkAmt=0;this.phase=0;this.faceY=0;this.hopY=0;this.heads=0;this.lay=false;this.layY=0;this.lookDown=false;this.tilt=0;this.nodOff=0;this.twist=0;this.shake=0;
    this.f={wave:false,hug:false,sad:false,kiss:false,blush:false,smile:false,closed:false};
    this.fk='';
    const M=c=>new THREE.MeshLambertMaterial({color:c});
    const bx=(w,h,d,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w*p,h*p,d*p),mat);m.position.set(x*p,y*p,z*p);par.add(m);return m};
    const mkLeg=x=>{const pv=new THREE.Group();pv.position.set(x*p,12*p,0);bx(4,12,4,M(o.pants),0,-6,0,pv);bx(4.2,2.2,4.6,M(o.shoe),0,-10.9,.3,pv);g.add(pv);return pv};
    this.legL=mkLeg(-2);this.legR=mkLeg(2);
    bx(8,12,4,M(o.shirt),0,18,0,g);
    const mkArm=x=>{const pv=new THREE.Group();pv.position.set(x*p,23.6*p,0);bx(4,12,4,M(o.skin),0,-5.6,0,pv);bx(4.3,4.6,4.3,M(o.shirt),0,-2.1,0,pv);g.add(pv);return pv};
    this.armL=mkArm(-6);this.armR=mkArm(6);
    this.headPiv=new THREE.Group();this.headPiv.position.set(0,24*p,0);g.add(this.headPiv);
    this.face=canvasTex(128,128,()=>{});
    this.img=new Image();this.img.onload=()=>{this.fk='';this.redraw()};this.img.src=o.faceSrc;
    const skinM=M(o.faceSkin),hairM=M(o.hair);
    const head=new THREE.Mesh(new THREE.BoxGeometry(8*p,8*p,8*p),[skinM,skinM,hairM,skinM,new THREE.MeshLambertMaterial({map:this.face.tex}),hairM]);
    head.position.y=4*p;this.headPiv.add(head);

      }
    }

  }
  const tp=viewFor();
  const k=V.snap?1:1-Math.exp(-dt*2.4);
  camera.position.lerp(tp[0],k);look.lerp(tp[1],k);camera.lookAt(look);

  requestAnimationFrame(loop);
}

function makeRunaway(b,sibling,ui){
  let fled=false,ph=null;
  const flee=ev=>{
    if(ev&&ev.preventDefault)ev.preventDefault();
    const r=b.getBoundingClientRect();
    if(!fled){
      fled=true;
      ph=document.createElement('span');ph.style.cssText='display:inline-block;width:'+r.width+'px;height:'+r.height+'px';
      b.parentNode.insertBefore(ph,b);
      b.style.width=r.width+'px';b.style.setProperty('--edge',getComputedStyle(dbox).getPropertyValue('--edge'));b.classList.add('flee');ui.appendChild(b);
    }
    const w=b.offsetWidth,h=b.offsetHeight,sr=sibling.getBoundingClientRect(),m=14;
    const cx=ev&&ev.clientX!==undefined?ev.clientX:r.left+w/2,cy=ev&&ev.clientY!==undefined?ev.clientY:r.top+h/2;
    let nx=m,ny=m+60;
    for(let i=0;i<40;i++){
      const x=rand(m,innerWidth-w-m),y=rand(m+60,innerHeight-h-m);
      const far=Math.hypot(x+w/2-cx,y+h/2-cy)>150;
      const clear=x>sr.right+24||x+w<sr.left-24||y>sr.bottom+24||y+h<sr.top-24;
      nx=x;ny=y;if(far&&clear)break;
    }
    b.style.left=nx+'px';b.style.top=ny+'px';
  };
  ['pointerenter','pointerdown','mousedown','touchstart','click'].forEach(n=>b.addEventListener(n,flee,{passive:false}));
  addEventListener('pointermove',e=>{
    if(!b.isConnected)return;
    const r=b.getBoundingClientRect();
    if(fled&&e.clientX>r.left-70&&e.clientX<r.right+70&&e.clientY>r.top-60&&e.clientY<r.bottom+60)flee(e);
  });
}

    btns.forEach((b,i)=>{

}

  A.set('hug',true);B.set('hug',true);A.set('closed',true);B.set('closed',true);
  for(let i=0;i<7;i++){const s=toScreen((A.x+B.x)/2,2.8,0);burst(s.x,s.y,8,{size:rand(22,40)});await delay(260)}
  A.set('hug',false);B.set('hug',false);A.set('closed',false);B.set('closed',false);
  const x0=A.x-.2,ax=A.x,bx=B.x;
  A.faceY=-Math.PI/2;B.faceY=-Math.PI/2;A.lay=true;B.lay=true;
  facesX=x0+2.7;setView('faces');
  chime();
  await tween(1100,k=>{
    A.g.position.x=ax+(x0-ax)*k;A.g.position.z=-.45*k;
    B.g.position.x=bx+(x0-bx)*k;B.g.position.z=.45*k;
    A.hopY=B.hopY=Math.sin(k*Math.PI)*.45;
  },easeInOut);
  A.hopY=B.hopY=0;
  A.twist=.6;B.twist=-.6;
  A.set('blush',true);B.set('blush',true);
  A.shake=B.shake=1;
  const LOLS=['JAJSKAKA','JAJAJAJA','JSJSKAKA','AJAKSJAJ','JAJSKAKA'];
  for(let i=0;i<10;i++){
    [A,B].forEach(c=>{c.set('laugh',true)});
    const s=toScreen(facesX,1.1,0);
    floatText(s.x+rand(-130,130),s.y+rand(-90,-20),LOLS[i%LOLS.length],i%2?'#ffd1e3':'#fff2b8');
    burst(s.x+rand(-70,70),s.y+rand(-30,30),5,{size:rand(22,38)});softChime();
    await delay(260);
    [A,B].forEach(c=>{c.set('laugh',false);c.set('closed',true)});
    await delay(220);
  }
  [A,B].forEach(c=>{c.set('closed',false);c.set('laugh',false);c.set('smile',true)});
  A.shake=B.shake=0;
  await delay(2200);
}

/* ---------- Final ---------- */
async function ending(){
  rain(Infinity);
  titleEl.style.top='14%';
  await showTitle('Feliz cumpleaños mi wawa',0,true);
  await delay(4500);
  const again=$('#again');again.hidden=false;
  again.addEventListener('click',()=>{try{location.reload()}catch(e){}});
}

/* ---------- Inicio ---------- */
async function main(){
  const st=$('#start');
  await new Promise(res=>{
    const go=()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();st.classList.add('gone');setTimeout(()=>st.remove(),900);res()};
    st.addEventListener('click',go,{once:true});
  });
  await sceneCat();
  await sceneMC();
  await afterKiss();
  await sceneBeach();
  await ending();
}
setBg('G');
main();
})();
